[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-langgraph"
version = "1.0.0"
description = "Fuzzy-logic orchestration and uncertainty-aware RAG for LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-core>=1.4.7,<2",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
